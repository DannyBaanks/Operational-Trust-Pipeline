[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operational-trust-pipeline"
version = "0.1.0"
description = "Provider-agnostic bounded operational action requests with verifiable evidence."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
drive = ["google-auth>=2.0", "google-auth-oauthlib>=1.0", "google-api-python-client>=2.0"]
dev-gui = ["PySide6>=6.5", "pytest-qt>=4.2"]
all = ["PySide6>=6.5", "google-auth>=2.0", "google-auth-oauthlib>=1.0", "google-api-python-client>=2.0"]

[project.scripts]
otp = "otp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
